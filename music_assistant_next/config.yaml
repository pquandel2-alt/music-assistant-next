name: Music Assistant Next
version: 2.11.0-next.1
slug: music_assistant_next
description: Discovery-first Music Assistant fork with an integrated catalog artist explorer.
url: https://github.com/pquandel2-alt/music-assistant-next
arch:
  - amd64
  - aarch64
homeassistant_api: true
hassio_api: true
hassio_role: manager
discovery:
  - music_assistant
auth_api: true
host_network: true
ingress: true
ingress_port: 8094
audio: true
panel_icon: mdi:music-circle
panel_title: Music Assistant Next
panel_admin: false
uart: false
apparmor: true
map:
  - media:rw
  - ssl:ro
init: false
backup_exclude:
  - cache.db
  - collage_images/*
  - .cache/*
  - library.db.backup
stage: experimental
image: ghcr.io/pquandel2-alt/music-assistant-next
tmpfs: true
options:
  log_level: info
  safe_mode: false
schema:
  log_level: list(debug|info|warning|error)
  safe_mode: bool
privileged:
  - SYS_ADMIN
  - DAC_READ_SEARCH
