name: Retag Container

on:
  workflow_dispatch:
    inputs:
      source_tag:
        description: Existing GHCR tag
        required: true
        type: string
      target_tag:
        description: Additional GHCR tag
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  retag:
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate and publish manifest alias
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/music-assistant-next
          SOURCE_TAG: ${{ inputs.source_tag }}
          TARGET_TAG: ${{ inputs.target_tag }}
        run: |
          tag_pattern='^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$'
          [[ "$SOURCE_TAG" =~ $tag_pattern ]]
          [[ "$TARGET_TAG" =~ $tag_pattern ]]
          docker buildx imagetools create \
            --tag "$IMAGE:$TARGET_TAG" \
            "$IMAGE:$SOURCE_TAG"
